        doc.platforms.forEach(function(p) { html += '<span class="platform-tag">' + p + '</span>'; });
        html += '</div></div>';
      });
      html += '</div>';
    });
    html += '</div></section>';
  });
  app.innerHTML = html;
})();
</script>
