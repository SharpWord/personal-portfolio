<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>高清3D地球</title>

  <script>
    window.CESIUM_BASE_URL = 'https://cesium.com/downloads/cesiumjs/releases/1.105/Build/Cesium/';
  </script>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.105/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.105/Build/Cesium/Widgets/widgets.css" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #cesiumContainer { width: 100%; height: 100%; overflow: hidden; background: #000; }
    .cesium-viewer-bottom { display: none !important; }

    /* 加载过场：纯黑遮罩 */
    #loadingOverlay {
      position: fixed; inset: 0; z-index: 200;
      background: #000; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      transition: opacity 1s ease;
      pointer-events: all;
    }
    #loadingOverlay.hidden { opacity: 0; pointer-events: none; }
    #loadingOverlay .spinner {
      width: 36px; height: 36px; border: 3px solid rgba(255,255,255,0.2);
      border-top-color: #fff; border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    #loadingOverlay .text {
      color: #fff; font-size: 14px; margin-top: 16px; opacity: 0.8;
    }
    #loadingOverlay .progress {
      width: 200px; height: 3px; background: rgba(255,255,255,0.15);
      border-radius: 3px; margin-top: 14px; overflow: hidden;
    }
    #loadingOverlay .progress-bar {
      height: 100%; background: #fff; border-radius: 3px;
      width: 0%; transition: width 0.4s ease;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #helpPanel {
      position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 10;
      background: rgba(0, 0, 0, 0.55); backdrop-filter: blur(10px); border-radius: 12px;
      padding: 12px 24px; color: #fff; font-size: 13px; display: flex; gap: 20px;
      pointer-events: none; user-select: none; border: 1px solid rgba(255, 255, 255, 0.1);
    }
    #helpPanel span { display: flex; align-items: center; gap: 8px; opacity: 0.85; }
    #helpPanel .key {
      display: inline-block; background: rgba(255, 255, 255, 0.2);
      border-radius: 5px; padding: 2px 8px; font-size: 11px; font-weight: 600;
    }

    #statusBar {
      position: absolute; top: 16px; right: 16px; z-index: 10;
      background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(8px); border-radius: 8px;
      padding: 8px 14px; color: #fff; font-size: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1); pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>

  <!-- 加载过场遮罩 -->
  <div id="loadingOverlay">
    <div class="spinner"></div>
    <div class="text">正在加载地球...</div>
    <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
  </div>

  <div id="statusBar">高度: -- | Lv.6</div>
  <div id="helpPanel">
    <span><span class="key">滚轮</span> 缩放</span>
    <span><span class="key">拖拽</span> 旋转</span>
    <span><span class="key">R</span> 重置</span>
  </div>

  <script>
    (function () {

      var viewer = new Cesium.Viewer('cesiumContainer', {
        animation: false, timeline: false, baseLayerPicker: false,
        homeButton: false, geocoder: false, navigationHelpButton: false,
        infoBox: false, selectionIndicator: false,
        imageryProvider: false,
      });

      var scene = viewer.scene;
      var globe = scene.globe;

      // ================================================================
      //  约束：2000-3000 公里，北京，仅旋转+缩放
      // ================================================================
      var MIN_HEIGHT = 2000000;
      var MAX_HEIGHT = 3000000;
      var CENTER_LON = 116.4;
      var CENTER_LAT = 39.9;

      scene.screenSpaceCameraController.enableTranslate = false;
      scene.screenSpaceCameraController.enableTilt = false;
      scene.screenSpaceCameraController.enableZoom = true;

      // ================================================================
      //  清晰度：Level 6（比上一版 level 5 高一档）
      //
      //  Level 6 瓦片数：64×64 = 4096 张（全球）
      //  2000km 时可见 ~60 张，分辨率约 150m/像素
      //  加载策略：先模糊后清晰，渐进式呈现
      // ================================================================
      globe.maximumScreenSpaceError = 16;       // 启动时最大模糊（只加载极少数瓦片）
      globe.tileCacheSize = 6000;               // 足够装下全部 4096 张

      // ================================================================
      //  渐进式清晰度动画
      //  从模糊(maxError=16) → 清晰(maxError=2.0)
      //  分 6 步，每步间隔 400ms，总耗时 ~2.4 秒
      // ================================================================
      var qualitySteps = [16, 10, 6, 4, 2.8, 2.0];
      var qualityTimer = null;
      var qualityStepIndex = 0;
      var started = false;
      var overlay = document.getElementById('loadingOverlay');
      var progressBar = document.getElementById('progressBar');
      var progressText = overlay.querySelector('.text');

      function startReveal() {
        if (started) return;
        started = true;

        function nextStep() {
          if (qualityStepIndex >= qualitySteps.length) {
            progressBar.style.width = '100%';
            progressText.textContent = '正在预载球背...';
            // 清晰度完成后，开始后台预加载全部 level 6 瓦片
            startBackgroundPreload();
            return;
          }
          globe.maximumScreenSpaceError = qualitySteps[qualityStepIndex];
          progressBar.style.width = ((qualityStepIndex + 1) / qualitySteps.length * 100) + '%';
          qualityStepIndex++;
          qualityTimer = setTimeout(nextStep, 400);
        }

        nextStep();
      }

      // ================================================================
      //  后台预加载：用原生 Image() 加载全部 level 6 瓦片
      //
      //  原理：完全绕开 Cesium 的 RequestScheduler，用浏览器原生
      //  Image() 分批加载全部 4096 张 level 6 瓦片。
      //
      //  每批 128 张，等待该批全部 settle（完成或失败），再发下一批。
      //  浏览器自动限制同源 TCP 连接数（6-8 个），所以不会炸。
      //
      //  4096 张 / 128 批 = 32 批
      //  每批约 2-4 秒（取决于 ESRI 速度）→ 总耗时 ~1-2 分钟
      //  但用户不需要等完——第一批（正面瓦片）最先加载，
      //  球背面的瓦片在后台静默完成
      // ================================================================
      var preloadTotal = 0;
      var preloadDone = 0;

      function startBackgroundPreload() {
        // 生成 level 6 全部瓦片坐标（64×64=4096 张）
        var size = 1 << 6;  // 2^6 = 64
        var urls = [];
        for (var y = 0; y < size; y++) {
          for (var x = 0; x < size; x++) {
            urls.push('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/6/' + y + '/' + x);
          }
        }
        preloadTotal = urls.length;

        var BATCH = 128;
        var index = 0;

        function loadBatch() {
          if (index >= preloadTotal) {
            // 全部结束或超时，揭幕
            progressText.textContent = '加载完成';
            progressBar.style.width = '100%';
            setTimeout(function () {
              overlay.classList.add('hidden');
            }, 400);
            return;
          }

          var batchEnd = Math.min(index + BATCH, preloadTotal);
          var batchUrls = urls.slice(index, batchEnd);
          index = batchEnd;

          var pending = batchUrls.length;

          batchUrls.forEach(function (u) {
            var img = new Image();
            img.onload = img.onerror = function () {
              preloadDone++;
              pending--;
              var pct = Math.round(preloadDone / preloadTotal * 100);
              progressBar.style.width = pct + '%';

              if (pending === 0) {
                // 当前批全部 settle，发下一批
                setTimeout(loadBatch, 50);
              }
            };
            img.src = u;
          });
        }

        loadBatch();
      }

      // ================================================================
      //  高度钳位
      // ================================================================
      scene.preRender.addEventListener(function () {
        var position = viewer.camera.positionCartographic;
        var h = position.height;
        if (h < MIN_HEIGHT || h > MAX_HEIGHT) {
          var clampedH = Math.max(MIN_HEIGHT, Math.min(MAX_HEIGHT, h));
          var cart = Cesium.Cartesian3.fromDegrees(
            Cesium.Math.toDegrees(position.longitude),
            Cesium.Math.toDegrees(position.latitude),
            clampedH
          );
          viewer.camera.position = cart;
        }
      });

      // ================================================================
      //  美感
      // ================================================================
      scene.skyAtmosphere = new Cesium.SkyAtmosphere(Cesium.Ellipsoid.WGS84);
      scene.skyBox = new Cesium.SkyBox({
        sources: {
          positiveX: Cesium.buildModuleUrl('Assets/Textures/SkyBox/tycho2t3_80_px.jpg'),
          negativeX: Cesium.buildModuleUrl('Assets/Textures/SkyBox/tycho2t3_80_mx.jpg'),
          positiveY: Cesium.buildModuleUrl('Assets/Textures/SkyBox/tycho2t3_80_py.jpg'),
          negativeY: Cesium.buildModuleUrl('Assets/Textures/SkyBox/tycho2t3_80_my.jpg'),
          positiveZ: Cesium.buildModuleUrl('Assets/Textures/SkyBox/tycho2t3_80_pz.jpg'),
          negativeZ: Cesium.buildModuleUrl('Assets/Textures/SkyBox/tycho2t3_80_mz.jpg'),
        },
      });

      globe.enableLighting = true;
      globe.lambertDiffuseMultiplier = 0.75;
      globe.baseColor = Cesium.Color.fromCssColorString('#0a1628');
      globe.showGroundAtmosphere = true;

      // ================================================================
      //  影像 —— min=1, max=6
      //  预加载时 Cesium 先显示 level 1-3（瞬时），再渐进升到 level 6
      //  避免 minLevel=6 时瞬间数百瓦片同时请求导致 abort
      // ================================================================
      viewer.imageryLayers.addImageryProvider(
        new Cesium.UrlTemplateImageryProvider({
          url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
          minimumLevel: 1,
          maximumLevel: 6,
          credit: 'Esri World Imagery',
        })
      );

      // ================================================================
      //  初始视角 —— 北京，2000 公里
      // ================================================================
      viewer.camera.setView({
        destination: Cesium.Cartesian3.fromDegrees(CENTER_LON, CENTER_LAT, MIN_HEIGHT),
        orientation: { heading: 0, pitch: Cesium.Math.toRadians(-90), roll: 0 },
      });

      // ================================================================
      //  状态栏
      // ================================================================
      var statusBar = document.getElementById('statusBar');
      scene.preRender.addEventListener(function () {
        var h = viewer.camera.positionCartographic.height;
        var km = (h / 1000).toFixed(0);
        statusBar.textContent = '高度: ' + km + '公里 | Lv.6 | ' +
          (h <= MIN_HEIGHT + 100 ? '最近' : h >= MAX_HEIGHT - 100 ? '最远' : '');
      });

      // ================================================================
      //  启动加载流程
      //  先用 16 的模糊值快速出图（1-2秒），然后渐进清晰
      // ================================================================
      setTimeout(startReveal, 1500);

      // ================================================================
      //  快捷键
      // ================================================================
      document.addEventListener('keydown', function (e) {
        var key = e.key.toLowerCase();
        if (key === 'r') {
          viewer.camera.flyTo({
            destination: Cesium.Cartesian3.fromDegrees(CENTER_LON, CENTER_LAT, MIN_HEIGHT),
            orientation: { heading: 0, pitch: Cesium.Math.toRadians(-90), roll: 0 },
            duration: 2.5,
          });
        }
        if (key === 'f') {
          document.fullscreenElement ? document.exitFullscreen() : document.getElementById('cesiumContainer').requestFullscreen();
        }
      });

      console.log('Level6 | 北京 2000-3000km | 4096瓦片 | Image()背景预加载');
    })();
  </script>
</body>
</html>
