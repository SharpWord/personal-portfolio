<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>高清3D地球 · 自然纪录片索引</title>

  <script>
    window.CESIUM_BASE_URL = 'https://cesium.com/downloads/cesiumjs/releases/1.105/Build/Cesium/';
  </script>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.105/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.105/Build/Cesium/Widgets/widgets.css" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #cesiumContainer { width: 100%; height: 100%; overflow: hidden; background: #000; }
    .cesium-viewer-bottom { display: none !important; }

    /* ===== 加载过场 ===== */
    #loadingOverlay {
      position: fixed; inset: 0; z-index: 200;
      background: #000; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      transition: opacity 1s ease; pointer-events: all;
    }
    #loadingOverlay.hidden { opacity: 0; pointer-events: none; }
    #loadingOverlay .spinner {
      width: 36px; height: 36px; border: 3px solid rgba(255,255,255,0.2);
      border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    #loadingOverlay .text { color: #fff; font-size: 14px; margin-top: 16px; opacity: 0.8; }
    #loadingOverlay .progress {
      width: 200px; height: 3px; background: rgba(255,255,255,0.15);
      border-radius: 3px; margin-top: 14px; overflow: hidden;
    }
    #loadingOverlay .progress-bar {
      height: 100%; background: #fff; border-radius: 3px;
      width: 0%; transition: width 0.4s ease;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== 浮动纪录片卡片 —— 跟踪地球表面标记点 ===== */
    #floatingCard {
      position: absolute; z-index: 50; pointer-events: none;
      opacity: 0; transform: translate(-50%, -100%) scale(0.85);
      transition: opacity 0.35s ease, transform 0.35s cubic-bezier(0.25,1,0.5,1);
      /* 由 JS postRender 实时更新 left/top */
    }
    #floatingCard.active { opacity: 1; transform: translate(-50%, -100%) scale(1); pointer-events: auto; }

    .card-inner {
      width: 340px;
      background: rgba(10,18,30,0.92); backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.14); border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 16px 48px rgba(0,0,0,0.6), 0 0 60px rgba(60,140,240,0.08);
    }

    /* 卡片尖角指向地球 */
    .card-inner::after {
      content: ''; position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%);
      width: 0; height: 0;
      border-left: 8px solid transparent; border-right: 8px solid transparent;
      border-top: 8px solid rgba(10,18,30,0.92);
    }

    /* 卡片头部 */
    .card-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px 12px;
    }
    .card-flag { font-size: 28px; line-height: 1; }
    .card-name { font-size: 18px; font-weight: 700; color: #fff; margin-left: 10px; }
    .card-close {
      background: none; border: none; color: #667; font-size: 18px;
      cursor: pointer; padding: 4px 8px; border-radius: 6px; line-height: 1;
      transition: all 0.2s; margin-left: auto;
    }
    .card-close:hover { background: rgba(255,255,255,0.1); color: #fff; }

    /* ===== 10秒推荐预览区 ===== */
    .preview-stage {
      position: relative; height: 160px; overflow: hidden;
      background: linear-gradient(135deg, #0d1a2d 0%, #152238 50%, #0a1628 100%);
    }
    .preview-slide {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
      padding: 20px 24px;
      opacity: 0; transform: translateY(16px) scale(0.96);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    .preview-slide.current {
      opacity: 1; transform: translateY(0) scale(1);
    }
    .preview-slide .slide-icon { font-size: 32px; margin-bottom: 6px; }
    .preview-slide .slide-title { font-size: 15px; font-weight: 700; color: #eee; margin-bottom: 6px; }
    .preview-slide .slide-wonder { font-size: 13px; color: #9ab; line-height: 1.5; max-width: 280px; }
    .preview-slide .slide-rating {
      margin-top: 8px; font-size: 11px; font-weight: 700; color: #f0b90b;
      background: rgba(240,185,11,0.1); border-radius: 4px; padding: 2px 8px;
    }

    /* 10秒倒计时进度条 */
    .preview-bar-wrap {
      position: absolute; bottom: 0; left: 0; right: 0; height: 3px;
      background: rgba(255,255,255,0.08);
    }
    .preview-bar-fill {
      height: 100%; background: linear-gradient(90deg, #4488cc, #66aadd);
      width: 100%; transition: width 0.1s linear;
    }
    .preview-timer {
      position: absolute; top: 8px; right: 12px;
      font-size: 11px; color: #667; font-weight: 600;
    }

    /* ===== 完整纪录片列表（预览结束后显示） ===== */
    .docs-list {
      padding: 12px 20px 16px; max-height: 260px; overflow-y: auto;
      display: none;
    }
    .docs-list.shown { display: block; }
    .docs-list .doc-row {
      padding: 10px 0; border-top: 1px solid rgba(255,255,255,0.05);
      display: flex; flex-direction: column; gap: 3px;
    }
    .docs-list .doc-row:first-child { padding-top: 0; border-top: none; }
    .docs-list .doc-title-row { display: flex; align-items: baseline; gap: 8px; }
    .docs-list .doc-t { font-size: 14px; font-weight: 600; color: #ddd; }
    .docs-list .doc-r {
      font-size: 10px; font-weight: 700; color: #f0b90b;
      background: rgba(240,185,11,0.1); border-radius: 3px; padding: 1px 5px;
    }
    .docs-list .doc-w { font-size: 12px; color: #889; line-height: 1.45; }
    .docs-list .doc-pf { display: flex; gap: 4px; flex-wrap: wrap; }
    .docs-list .doc-pf span {
      font-size: 10px; padding: 1px 6px; border-radius: 3px;
      background: rgba(100,180,120,0.12); color: #8c8;
    }
    .docs-list::-webkit-scrollbar { width: 3px; }
    .docs-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

    /* ===== 状态栏 & 帮助 ===== */
    #helpPanel {
      position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 10;
      background: rgba(0,0,0,0.55); backdrop-filter: blur(10px); border-radius: 12px;
      padding: 12px 24px; color: #fff; font-size: 13px; display: flex; gap: 20px;
      pointer-events: none; user-select: none; border: 1px solid rgba(255,255,255,0.1);
    }
    #helpPanel span { display: flex; align-items: center; gap: 8px; opacity: 0.85; }
    #helpPanel .key {
      display: inline-block; background: rgba(255,255,255,0.2);
      border-radius: 5px; padding: 2px 8px; font-size: 11px; font-weight: 600;
    }
    #statusBar {
      position: absolute; top: 16px; right: 16px; z-index: 10;
      background: rgba(0,0,0,0.5); backdrop-filter: blur(8px); border-radius: 8px;
      padding: 8px 14px; color: #fff; font-size: 12px;
      border: 1px solid rgba(255,255,255,0.1); pointer-events: none;
    }
    #markerHint {
      position: absolute; top: 60px; left: 16px; z-index: 10;
      background: rgba(0,0,0,0.45); backdrop-filter: blur(8px); border-radius: 8px;
      padding: 8px 14px; color: #8899aa; font-size: 11px;
      border: 1px solid rgba(255,255,255,0.08); pointer-events: none;
      transition: opacity 0.5s;
    }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>

  <!-- 加载遮罩 -->
  <div id="loadingOverlay">
    <div class="spinner"></div>
    <div class="text">正在加载地球...</div>
    <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
  </div>

  <div id="statusBar">高度: -- | Lv.6</div>
  <div id="markerHint">每颗亮点 = 一个国家 · 点击查看纪录片</div>
  <div id="helpPanel">
    <span><span class="key">滚轮</span> 缩放</span>
    <span><span class="key">拖拽</span> 旋转</span>
    <span><span class="key">R</span> 重置</span>
  </div>

  <!-- 浮动卡片：跟踪地球表面标记点 -->
  <div id="floatingCard">
    <div class="card-inner">
      <div class="card-head">
        <div><span class="card-flag" id="cfFlag"></span><span class="card-name" id="cfName"></span></div>
        <button class="card-close" id="cfClose">✕</button>
      </div>
      <!-- 10秒预览区 -->
      <div class="preview-stage" id="previewStage">
        <span class="preview-timer" id="previewTimer">10s</span>
        <div class="preview-bar-wrap"><div class="preview-bar-fill" id="previewBarFill"></div></div>
      </div>
      <!-- 完整纪录片列表 -->
      <div class="docs-list" id="docsList"></div>
    </div>
  </div>

  <script>
    (function () {

      var viewer = new Cesium.Viewer('cesiumContainer', {
        animation: false, timeline: false, baseLayerPicker: false,
        homeButton: false, geocoder: false, navigationHelpButton: false,
        infoBox: false, selectionIndicator: false,
        imageryProvider: false,
      });

      var scene = viewer.scene;
      var globe = scene.globe;

      // ================================================================
      //  约束：2000-3000 公里，北京，仅旋转+缩放
      // ================================================================
      var MIN_HEIGHT = 2000000;
      var MAX_HEIGHT = 3000000;
      var CENTER_LON = 116.4;
      var CENTER_LAT = 39.9;

      var params = new URLSearchParams(window.location.search);
      var urlCountry = params.get('country') || '';
      var urlLon = parseFloat(params.get('lon')) || CENTER_LON;
      var urlLat = parseFloat(params.get('lat')) || CENTER_LAT;
      var hasTarget = params.has('lon') && params.has('lat');

      scene.screenSpaceCameraController.enableTranslate = false;
      scene.screenSpaceCameraController.enableTilt = false;
      scene.screenSpaceCameraController.enableZoom = true;

      // ================================================================
      //  清晰度
      // ================================================================
      globe.maximumScreenSpaceError = 16;
      globe.tileCacheSize = 6000;

      // ================================================================
      //  渐进式清晰度动画
      // ================================================================
      var qualitySteps = [16, 10, 6, 4, 2.8, 2.0];
      var qualityTimer = null;
      var qualityStepIndex = 0;
      var started = false;
      var overlay = document.getElementById('loadingOverlay');
      var progressBar = document.getElementById('progressBar');
      var progressText = overlay.querySelector('.text');

      function startReveal() {
        if (started) return;
        started = true;
        function nextStep() {
          if (qualityStepIndex >= qualitySteps.length) {
            progressBar.style.width = '100%';
            progressText.textContent = '正在预载球背...';
            startBackgroundPreload();
            return;
          }
          globe.maximumScreenSpaceError = qualitySteps[qualityStepIndex];
          progressBar.style.width = ((qualityStepIndex + 1) / qualitySteps.length * 100) + '%';
          qualityStepIndex++;
          qualityTimer = setTimeout(nextStep, 400);
        }
        nextStep();
      }

      // ================================================================
      //  后台预加载全部 level 6 瓦片
      // ================================================================
      var preloadTotal = 0;
      var preloadDone = 0;

      function startBackgroundPreload() {
        var size = 1 << 6;
        var urls = [];
        for (var y = 0; y < size; y++) {
          for (var x = 0; x < size; x++) {
            urls.push('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/6/' + y + '/' + x);
          }
        }
        preloadTotal = urls.length;
        var BATCH = 128;
        var index = 0;
        function loadBatch() {
          if (index >= preloadTotal) {
            progressText.textContent = '加载完成';
            progressBar.style.width = '100%';
            setTimeout(function () { overlay.classList.add('hidden'); }, 400);
            return;
          }
          var batchEnd = Math.min(index + BATCH, preloadTotal);
          var batchUrls = urls.slice(index, batchEnd);
          index = batchEnd;
          var pending = batchUrls.length;
          batchUrls.forEach(function (u) {
            var img = new Image();
            img.onload = img.onerror = function () {
              preloadDone++;
              pending--;
              progressBar.style.width = Math.round(preloadDone / preloadTotal * 100) + '%';
              if (pending === 0) setTimeout(loadBatch, 50);
            };
            img.src = u;
          });
        }
        loadBatch();
      }

      // ================================================================
      //  高度钳位
      // ================================================================
      scene.preRender.addEventListener(function () {
        var position = viewer.camera.positionCartographic;
        var h = position.height;
        if (h < MIN_HEIGHT || h > MAX_HEIGHT) {
          var clampedH = Math.max(MIN_HEIGHT, Math.min(MAX_HEIGHT, h));
          viewer.camera.position = Cesium.Cartesian3.fromDegrees(
            Cesium.Math.toDegrees(position.longitude),
            Cesium.Math.toDegrees(position.latitude), clampedH);
        }
      });

      // ================================================================
      //  美感
      // ================================================================
      scene.skyAtmosphere = new Cesium.SkyAtmosphere(Cesium.Ellipsoid.WGS84);
      scene.skyBox = new Cesium.SkyBox({
        sources: {
          positiveX: Cesium.buildModuleUrl('Assets/Textures/SkyBox/tycho2t3_80_px.jpg'),
          negativeX: Cesium.buildModuleUrl('Assets/Textures/SkyBox/tycho2t3_80_mx.jpg'),
          positiveY: Cesium.buildModuleUrl('Assets/Textures/SkyBox/tycho2t3_80_py.jpg'),
          negativeY: Cesium.buildModuleUrl('Assets/Textures/SkyBox/tycho2t3_80_my.jpg'),
          positiveZ: Cesium.buildModuleUrl('Assets/Textures/SkyBox/tycho2t3_80_pz.jpg'),
          negativeZ: Cesium.buildModuleUrl('Assets/Textures/SkyBox/tycho2t3_80_mz.jpg'),
        },
      });
      globe.enableLighting = true;
      globe.lambertDiffuseMultiplier = 0.75;
      globe.baseColor = Cesium.Color.fromCssColorString('#0a1628');
      globe.showGroundAtmosphere = true;

      // ================================================================
      //  影像
      // ================================================================
      viewer.imageryLayers.addImageryProvider(
        new Cesium.UrlTemplateImageryProvider({
          url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
          minimumLevel: 1,
          maximumLevel: 6,
          credit: 'Esri World Imagery',
        })
      );

      // ================================================================
      //  初始视角
      // ================================================================
      var initLon = hasTarget ? urlLon : CENTER_LON;
      var initLat = hasTarget ? urlLat : CENTER_LAT;
      viewer.camera.setView({
        destination: Cesium.Cartesian3.fromDegrees(initLon, initLat, MIN_HEIGHT),
        orientation: { heading: 0, pitch: Cesium.Math.toRadians(-90), roll: 0 },
      });

      // ================================================================
      //  状态栏
      // ================================================================
      var statusBar = document.getElementById('statusBar');
      scene.preRender.addEventListener(function () {
        var h = viewer.camera.positionCartographic.height;
        var km = (h / 1000).toFixed(0);
        statusBar.textContent = (urlCountry ? urlCountry + ' | ' : '') + '高度: ' + km + '公里 | Lv.6 | ' +
          (h <= MIN_HEIGHT + 100 ? '最近' : h >= MAX_HEIGHT - 100 ? '最远' : '');
      });

      // ================================================================
      //  快捷键
      // ================================================================
      document.addEventListener('keydown', function (e) {
        var key = e.key.toLowerCase();
        if (key === 'r') {
          viewer.camera.flyTo({
            destination: Cesium.Cartesian3.fromDegrees(CENTER_LON, CENTER_LAT, MIN_HEIGHT),
            orientation: { heading: 0, pitch: Cesium.Math.toRadians(-90), roll: 0 },
            duration: 2.5,
          });
        }
        if (key === 'f') {
          document.fullscreenElement ? document.exitFullscreen() : document.getElementById('cesiumContainer').requestFullscreen();
        }
      });

      var countryDocs = [

          {title:'《第三极》',rating:'9.4',wonders:'珠穆朗玛峰冰塔林、纳木错、羌塘无人区、藏北高原湿地、喜马拉雅山脉',pf:['哔哩哔哩','腾讯视频']}
        ]},

        ]},
        { name:'俄罗斯', flag:'🇷🇺', lon:90, lat:62, docs:[
          {title:'《野性俄罗斯》',rating:'8.9',wonders:'贝加尔湖、勘察加火山群、西伯利亚泰加林、北极苔原、高加索山脉',pf:['哔哩哔哩']}
        ]},
        { name:'印度', flag:'🇮🇳', lon:78, lat:22, docs:[
          {title:'《野性印度》',rating:'8.7',wonders:'喜马拉雅南麓山地、西高止山雨林、塔尔沙漠、恒河湿地、德干高原',pf:['哔哩哔哩']}
        ]},
        { name:'印度尼西亚', flag:'🇮🇩', lon:115, lat:-2, docs:[
          {title:'《野性印度尼西亚》',rating:'8.6',wonders:'科莫多岛、婆罗洲雨林、巴厘岛火山、苏拉威西珊瑚海、爪哇火山群',pf:['哔哩哔哩']}

      // ================================================================
      //  创建标记点（发光点 + 国旗标签，16px 大字体清晰版）
      // ================================================================
      function createMarkerImage() {
        var size = 48;
        var canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        var ctx = canvas.getContext('2d');
        var half = size / 2;
        var grad = ctx.createRadialGradient(half, half, 0, half, half, half);
        grad.addColorStop(0, 'rgba(255,255,255,1)');
        grad.addColorStop(0.12, 'rgba(120,200,255,0.95)');
        grad.addColorStop(0.35, 'rgba(60,140,240,0.45)');
        grad.addColorStop(1, 'rgba(30,80,180,0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, size, size);
        // 中心亮白点
        ctx.beginPath(); ctx.arc(half, half, 3, 0, Math.PI*2);
        ctx.fillStyle = '#fff'; ctx.fill();
        return canvas;
      }

      // 国旗 Canvas 纹理（48px 高清渲染，Apple 表情包风格）
      function createFlagCanvas(flag) {
        var size = 64;
        var canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        var ctx = canvas.getContext('2d');
        ctx.font = '42px "Apple Color Emoji","Noto Color Emoji","Segoe UI Emoji",sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(flag, size/2, size/2);
        return canvas;
      }

      countryDocs.forEach(function(c) {
        var entity = viewer.entities.add({
          position: Cesium.Cartesian3.fromDegrees(c.lon, c.lat),
          billboard: {
            image: createFlagCanvas(c.flag),
            width: 18,
            height: 18,
            verticalOrigin: Cesium.VerticalOrigin.CENTER,
            horizontalOrigin: Cesium.HorizontalOrigin.CENTER,
            pixelOffset: new Cesium.Cartesian2(0, -14),
          },
          label: {
            text: c.name,
            font: 'bold 15px "PingFang SC","Inter","Helvetica Neue",sans-serif',
            fillColor: Cesium.Color.fromCssColorString('#ffffff'),
            outlineColor: Cesium.Color.fromCssColorString('#000000'),
            outlineWidth: 3,
            style: Cesium.LabelStyle.FILL_AND_OUTLINE,
            pixelOffset: new Cesium.Cartesian2(0, -32),
            verticalOrigin: Cesium.VerticalOrigin.TOP,
            horizontalOrigin: Cesium.HorizontalOrigin.CENTER,
            distanceDisplayCondition: new Cesium.DistanceDisplayCondition(0, 50000000),
          },
          _countryData: c,
        });
      });

      // ================================================================
      //  浮动卡片元素
      // ================================================================
      var fCard = document.getElementById('floatingCard');
      var cfFlag = document.getElementById('cfFlag');
      var cfName = document.getElementById('cfName');
      var cfClose = document.getElementById('cfClose');
      var previewStage = document.getElementById('previewStage');
      var previewTimer = document.getElementById('previewTimer');
      var previewBarFill = document.getElementById('previewBarFill');
      var docsList = document.getElementById('docsList');
      var markerHint = document.getElementById('markerHint');

      var activeCountry = null;     // 当前选中的国家数据
      var activeEntity = null;      // 当前选中的 entity
      var previewInterval = null;   // 预览轮播定时器
      var previewCountdown = null;  // 倒计时定时器
      var previewSlideIdx = 0;

      // ================================================================
      //  显示卡片 + 启动 10 秒预览
      // ================================================================
      function showCard(country, entity) {
        // 停掉之前的定时器
        clearPreviews();

        activeCountry = country;
        activeEntity = entity;

        cfFlag.textContent = country.flag;
        cfName.textContent = country.name;

        // 重置预览区
        previewStage.querySelectorAll('.preview-slide').forEach(function(s) { s.remove(); });
        docsList.classList.remove('shown');
        docsList.innerHTML = '';

        // 构建预览幻灯片：每部纪录片一个 slide
        country.docs.forEach(function(d, i) {
          var slide = document.createElement('div');
          slide.className = 'preview-slide';
          if (i === 0) slide.classList.add('current');
          slide.innerHTML =
            '<div class="slide-icon">' + d.wonders.split('、')[0].slice(0,2) + '</div>' +
            '<div class="slide-title">' + d.title + '</div>' +
            '<div class="slide-wonder">' + d.wonders + '</div>' +
            '<div class="slide-rating">⭐ ' + d.rating + '</div>';
          previewStage.appendChild(slide);
        });

        previewSlideIdx = 0;
        fCard.classList.add('active');
        markerHint.style.opacity = '0';

        // 10 秒倒计时
        var totalSlides = country.docs.length;
        var slideDuration = totalSlides > 1 ? 10000 / totalSlides : 10000; // 每 slide 平均时间
        var elapsed = 0;
        var startTime = Date.now();

        function advanceSlide() {
          var slides = previewStage.querySelectorAll('.preview-slide');
          if (slides.length === 0) return;
          slides[previewSlideIdx].classList.remove('current');
          previewSlideIdx = (previewSlideIdx + 1) % slides.length;
          slides[previewSlideIdx].classList.add('current');
        }

        if (totalSlides > 1) {
          previewInterval = setInterval(advanceSlide, slideDuration);
        }

        previewCountdown = setInterval(function () {
          elapsed = Date.now() - startTime;
          var remain = Math.max(0, 10000 - elapsed);
          var pct = remain / 10000 * 100;
          previewBarFill.style.width = pct + '%';
          previewTimer.textContent = Math.ceil(remain / 1000) + 's';

          if (elapsed >= 10000) {
            clearPreviews();
            previewBarFill.style.width = '0%';
            previewTimer.textContent = '';
            // 预览结束 → 显示完整纪录片列表
            showDocsList(country);
          }
        }, 100);
      }

      function clearPreviews() {
        if (previewInterval) { clearInterval(previewInterval); previewInterval = null; }
        if (previewCountdown) { clearInterval(previewCountdown); previewCountdown = null; }
      }

      function showDocsList(country) {
        var html = '';
        country.docs.forEach(function(d) {
          html += '<div class="doc-row">';
          html += '<div class="doc-title-row"><span class="doc-t">' + d.title + '</span><span class="doc-r">⭐ ' + d.rating + '</span></div>';
          html += '<div class="doc-w">' + d.wonders + '</div>';
          html += '<div class="doc-pf">';
          d.pf.forEach(function(p) { html += '<span>' + p + '</span>'; });
          html += '</div></div>';
        });
        docsList.innerHTML = html;
        docsList.classList.add('shown');
      }

      function hideCard() {
        clearPreviews();
        activeCountry = null;
        activeEntity = null;
        fCard.classList.remove('active');
        markerHint.style.opacity = '1';
      }

      cfClose.addEventListener('click', hideCard);

      // ================================================================
      //  每帧：将浮动卡片跟踪到地球表面标记点坐标
      // ================================================================
      scene.postRender.addEventListener(function () {
        if (!activeCountry || !activeEntity) return;
        var pos3d = activeEntity.position.getValue(viewer.clock.currentTime);
        if (!pos3d) return;
        var screenPos = Cesium.SceneTransforms.wgs84ToWindowCoordinates(scene, pos3d);
        if (!screenPos) {
          fCard.classList.remove('active');
          return;
        }
        fCard.style.left = screenPos.x + 'px';
        fCard.style.top = (screenPos.y - 40) + 'px'; // 偏移到标记点上方
      });

      // ================================================================
      //  点击事件
      // ================================================================
      var handler = new Cesium.ScreenSpaceEventHandler(scene.canvas);
      handler.setInputAction(function (click) {
        var picked = viewer.scene.pick(click.position);
        if (picked && picked.id && picked.id._countryData) {
          var c = picked.id._countryData;
          viewer.camera.flyTo({
            destination: Cesium.Cartesian3.fromDegrees(c.lon, c.lat, MIN_HEIGHT),
            orientation: { heading: 0, pitch: Cesium.Math.toRadians(-90), roll: 0 },
            duration: 1.5,
          });
          showCard(c, picked.id);
        } else {
          hideCard();
        }
      }, Cesium.ScreenSpaceEventType.LEFT_CLICK);

      // ================================================================
      //  加载完成后：提示 + URL 跳转自动弹出
      // ================================================================
      setTimeout(function () {
        var check = setInterval(function () {
          if (overlay.classList.contains('hidden')) {
            markerHint.style.opacity = '1';
            clearInterval(check);
            if (hasTarget && urlCountry) autoShowCountry(urlCountry);
          }
        }, 500);
      }, 3000);

      function autoShowCountry(name) {
        var found = null;
        countryDocs.forEach(function(c) {
          if (c.name.indexOf(name) !== -1 || name.indexOf(c.name) !== -1) found = c;
        });
        var exact = countryDocs.filter(function(c) { return c.name === name; });
        if (exact.length) found = exact[0];
        if (!found) return;
        // 找到对应 entity
        var targetEntity = null;
        viewer.entities.values.forEach(function(e) {
          if (e._countryData === found) targetEntity = e;
        });
        viewer.camera.flyTo({
          destination: Cesium.Cartesian3.fromDegrees(found.lon, found.lat, MIN_HEIGHT),
          orientation: { heading: 0, pitch: Cesium.Math.toRadians(-90), roll: 0 },
          duration: 1.5,
          complete: function () {
            showCard(found, targetEntity);
          }
        });
      }

      // ================================================================
      //  启动
      // ================================================================
      setTimeout(startReveal, 1500);

      console.log('Level6 | 北京 2000-3000km | 浮动卡片+10秒预览 | 国旗Canvas高清');
    })();
  </script>
