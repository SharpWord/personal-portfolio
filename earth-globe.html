<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>高清3D地球</title>

  <script>
    window.CESIUM_BASE_URL = 'https://cesium.com/downloads/cesiumjs/releases/1.105/Build/Cesium/';
  </script>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.105/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.105/Build/Cesium/Widgets/widgets.css" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #cesiumContainer { width: 100%; height: 100%; overflow: hidden; background: #000; }
    .cesium-viewer-bottom { display: none !important; }

    /* 加载过场：纯黑遮罩 */
    #loadingOverlay {
      position: fixed; inset: 0; z-index: 200;
      background: #000; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      transition: opacity 1s ease;
      pointer-events: all;
    }
    #loadingOverlay.hidden { opacity: 0; pointer-events: none; }
    #loadingOverlay .spinner {
      width: 36px; height: 36px; border: 3px solid rgba(255,255,255,0.2);
      border-top-color: #fff; border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    #loadingOverlay .text {
      color: #fff; font-size: 14px; margin-top: 16px; opacity: 0.8;
    }
    #loadingOverlay .progress {
      width: 200px; height: 3px; background: rgba(255,255,255,0.15);
      border-radius: 3px; margin-top: 14px; overflow: hidden;
    }
    #loadingOverlay .progress-bar {
      height: 100%; background: #fff; border-radius: 3px;
      width: 0%; transition: width 0.4s ease;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #helpPanel {
      position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 10;
      background: rgba(0, 0, 0, 0.55); backdrop-filter: blur(10px); border-radius: 12px;
      padding: 12px 24px; color: #fff; font-size: 13px; display: flex; gap: 20px;
      pointer-events: none; user-select: none; border: 1px solid rgba(255, 255, 255, 0.1);
    }
    #helpPanel span { display: flex; align-items: center; gap: 8px; opacity: 0.85; }
    #helpPanel .key {
      display: inline-block; background: rgba(255, 255, 255, 0.2);
      border-radius: 5px; padding: 2px 8px; font-size: 11px; font-weight: 600;
    }

    #statusBar {
      position: absolute; top: 16px; right: 16px; z-index: 10;
      background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(8px); border-radius: 8px;
      padding: 8px 14px; color: #fff; font-size: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1); pointer-events: none;
    }

    /* ===== 纪录片弹出卡片 ===== */
    #docPopup {
      position: absolute; bottom: -520px; left: 50%; transform: translateX(-50%); z-index: 50;
      width: min(620px, 92vw); max-height: 480px; overflow-y: auto;
      background: rgba(10, 18, 30, 0.94); backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 16px;
      padding: 24px 28px 20px; color: #e4e6ea;
      transition: bottom 0.45s cubic-bezier(0.25, 1, 0.5, 1);
      box-shadow: 0 -8px 40px rgba(0,0,0,0.5);
    }
    #docPopup.visible { bottom: 28px; }
    #docPopup .pop-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    #docPopup .pop-flag   { font-size: 26px; }
    #docPopup .pop-name   { font-size: 18px; font-weight: 700; color: #fff; margin-left: 8px; }
    #docPopup .pop-close  {
      background: none; border: none; color: #8899aa; font-size: 20px;
      cursor: pointer; padding: 4px 8px; border-radius: 6px; line-height: 1;
      transition: background 0.2s;
    }
    #docPopup .pop-close:hover { background: rgba(255,255,255,0.08); color: #fff; }
    #docPopup .doc-item {
      padding: 12px 0; border-top: 1px solid rgba(255,255,255,0.06);
    }
    #docPopup .doc-item:first-of-type { padding-top: 0; border-top: none; }
    #docPopup .doc-title-row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
    #docPopup .doc-title  { font-size: 14px; font-weight: 600; color: #ddd; }
    #docPopup .doc-rating {
      font-size: 11px; font-weight: 700; color: #f0b90b;
      background: rgba(240,185,11,0.12); border-radius: 4px; padding: 1px 6px;
    }
    #docPopup .doc-wonders { font-size: 12px; color: #889; line-height: 1.5; margin-bottom: 4px; }
    #docPopup .platform-tag {
      display: inline-block; font-size: 10px; padding: 2px 7px; border-radius: 3px;
      background: rgba(100,180,120,0.12); color: #8c8; margin-right: 4px;
    }
    #docPopup .pop-empty { text-align: center; color: #556; font-size: 13px; padding: 12px 0; }
    #docPopup::-webkit-scrollbar { width: 4px; }
    #docPopup::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

    /* ===== 标记点图例 ===== */
    #markerHint {
      position: absolute; top: 60px; left: 16px; z-index: 10;
      background: rgba(0,0,0,0.45); backdrop-filter: blur(8px); border-radius: 8px;
      padding: 8px 14px; color: #8899aa; font-size: 11px;
      border: 1px solid rgba(255,255,255,0.08); pointer-events: none;
      transition: opacity 0.5s;
    }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>

  <!-- 加载过场遮罩 -->
  <div id="loadingOverlay">
    <div class="spinner"></div>
    <div class="text">正在加载地球...</div>
    <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
  </div>

  <div id="statusBar">高度: -- | Lv.6</div>
  <div id="markerHint">每颗亮点 = 一个国家 · 点击查看纪录片</div>
  <div id="helpPanel">
    <span><span class="key">滚轮</span> 缩放</span>
    <span><span class="key">拖拽</span> 旋转</span>
    <span><span class="key">R</span> 重置</span>
  </div>

  <!-- 纪录片弹出卡片 -->
  <div id="docPopup">
    <div class="pop-header">
      <div><span class="pop-flag" id="popFlag"></span><span class="pop-name" id="popName"></span></div>
      <button class="pop-close" onclick="document.getElementById('docPopup').classList.remove('visible')">✕</button>
    </div>
    <div id="popContent"></div>
  </div>

  <script>
    (function () {

      var viewer = new Cesium.Viewer('cesiumContainer', {
        animation: false, timeline: false, baseLayerPicker: false,
        homeButton: false, geocoder: false, navigationHelpButton: false,
        infoBox: false, selectionIndicator: false,
        imageryProvider: false,
      });

      var scene = viewer.scene;
      var globe = scene.globe;

      // ================================================================
      //  约束：2000-3000 公里，北京，仅旋转+缩放
      // ================================================================
      var MIN_HEIGHT = 2000000;
      var MAX_HEIGHT = 3000000;
      var CENTER_LON = 116.4;
      var CENTER_LAT = 39.9;

      // 读取 URL 参数：?country=中国&lon=116.4&lat=39.9
      var params = new URLSearchParams(window.location.search);
      var urlCountry = params.get('country') || '';
      var urlLon = parseFloat(params.get('lon')) || CENTER_LON;
      var urlLat = parseFloat(params.get('lat')) || CENTER_LAT;
      var hasTarget = params.has('lon') && params.has('lat');

      scene.screenSpaceCameraController.enableTranslate = false;
      scene.screenSpaceCameraController.enableTilt = false;
      scene.screenSpaceCameraController.enableZoom = true;

      // ================================================================
      //  清晰度：Level 6（比上一版 level 5 高一档）
      //
      //  Level 6 瓦片数：64×64 = 4096 张（全球）
      //  2000km 时可见 ~60 张，分辨率约 150m/像素
      //  加载策略：先模糊后清晰，渐进式呈现
      // ================================================================
      globe.maximumScreenSpaceError = 16;       // 启动时最大模糊（只加载极少数瓦片）
      globe.tileCacheSize = 6000;               // 足够装下全部 4096 张

      // ================================================================
      //  渐进式清晰度动画
      //  从模糊(maxError=16) → 清晰(maxError=2.0)
      //  分 6 步，每步间隔 400ms，总耗时 ~2.4 秒
      // ================================================================
      var qualitySteps = [16, 10, 6, 4, 2.8, 2.0];
      var qualityTimer = null;
      var qualityStepIndex = 0;
      var started = false;
      var overlay = document.getElementById('loadingOverlay');
      var progressBar = document.getElementById('progressBar');
      var progressText = overlay.querySelector('.text');

      function startReveal() {
        if (started) return;
        started = true;

        function nextStep() {
          if (qualityStepIndex >= qualitySteps.length) {
            progressBar.style.width = '100%';
            progressText.textContent = '正在预载球背...';
            // 清晰度完成后，开始后台预加载全部 level 6 瓦片
            startBackgroundPreload();
            return;
          }
          globe.maximumScreenSpaceError = qualitySteps[qualityStepIndex];
          progressBar.style.width = ((qualityStepIndex + 1) / qualitySteps.length * 100) + '%';
          qualityStepIndex++;
          qualityTimer = setTimeout(nextStep, 400);
        }

        nextStep();
      }

      // ================================================================
      //  后台预加载：用原生 Image() 加载全部 level 6 瓦片
      //
      //  原理：完全绕开 Cesium 的 RequestScheduler，用浏览器原生
      //  Image() 分批加载全部 4096 张 level 6 瓦片。
      //
      //  每批 128 张，等待该批全部 settle（完成或失败），再发下一批。
      //  浏览器自动限制同源 TCP 连接数（6-8 个），所以不会炸。
      //
      //  4096 张 / 128 批 = 32 批
      //  每批约 2-4 秒（取决于 ESRI 速度）→ 总耗时 ~1-2 分钟
      //  但用户不需要等完——第一批（正面瓦片）最先加载，
      //  球背面的瓦片在后台静默完成
      // ================================================================
      var preloadTotal = 0;
      var preloadDone = 0;

      function startBackgroundPreload() {
        // 生成 level 6 全部瓦片坐标（64×64=4096 张）
        var size = 1 << 6;  // 2^6 = 64
        var urls = [];
        for (var y = 0; y < size; y++) {
          for (var x = 0; x < size; x++) {
            urls.push('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/6/' + y + '/' + x);
          }
        }
        preloadTotal = urls.length;

        var BATCH = 128;
        var index = 0;

        function loadBatch() {
          if (index >= preloadTotal) {
            // 全部结束或超时，揭幕
            progressText.textContent = '加载完成';
            progressBar.style.width = '100%';
            setTimeout(function () {
              overlay.classList.add('hidden');
            }, 400);
            return;
          }

          var batchEnd = Math.min(index + BATCH, preloadTotal);
          var batchUrls = urls.slice(index, batchEnd);
          index = batchEnd;

          var pending = batchUrls.length;

          batchUrls.forEach(function (u) {
            var img = new Image();
            img.onload = img.onerror = function () {
              preloadDone++;
              pending--;
              var pct = Math.round(preloadDone / preloadTotal * 100);
              progressBar.style.width = pct + '%';

              if (pending === 0) {
                // 当前批全部 settle，发下一批
                setTimeout(loadBatch, 50);
              }
            };
            img.src = u;
          });
        }

        loadBatch();
      }

      // ================================================================
      //  高度钳位
      // ================================================================
      scene.preRender.addEventListener(function () {
        var position = viewer.camera.positionCartographic;
        var h = position.height;
        if (h < MIN_HEIGHT || h > MAX_HEIGHT) {
          var clampedH = Math.max(MIN_HEIGHT, Math.min(MAX_HEIGHT, h));
          var cart = Cesium.Cartesian3.fromDegrees(
            Cesium.Math.toDegrees(position.longitude),
            Cesium.Math.toDegrees(position.latitude),
            clampedH
          );
          viewer.camera.position = cart;
        }
      });

      // ================================================================
      //  美感
      // ================================================================
      scene.skyAtmosphere = new Cesium.SkyAtmosphere(Cesium.Ellipsoid.WGS84);
      scene.skyBox = new Cesium.SkyBox({
        sources: {
          positiveX: Cesium.buildModuleUrl('Assets/Textures/SkyBox/tycho2t3_80_px.jpg'),
          negativeX: Cesium.buildModuleUrl('Assets/Textures/SkyBox/tycho2t3_80_mx.jpg'),
          positiveY: Cesium.buildModuleUrl('Assets/Textures/SkyBox/tycho2t3_80_py.jpg'),
          negativeY: Cesium.buildModuleUrl('Assets/Textures/SkyBox/tycho2t3_80_my.jpg'),
          positiveZ: Cesium.buildModuleUrl('Assets/Textures/SkyBox/tycho2t3_80_pz.jpg'),
          negativeZ: Cesium.buildModuleUrl('Assets/Textures/SkyBox/tycho2t3_80_mz.jpg'),
        },
      });

      globe.enableLighting = true;
      globe.lambertDiffuseMultiplier = 0.75;
      globe.baseColor = Cesium.Color.fromCssColorString('#0a1628');
      globe.showGroundAtmosphere = true;

      // ================================================================
      //  影像 —— min=1, max=6
      //  预加载时 Cesium 先显示 level 1-3（瞬时），再渐进升到 level 6
      //  避免 minLevel=6 时瞬间数百瓦片同时请求导致 abort
      // ================================================================
      viewer.imageryLayers.addImageryProvider(
        new Cesium.UrlTemplateImageryProvider({
          url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
          minimumLevel: 1,
          maximumLevel: 6,
          credit: 'Esri World Imagery',
        })
      );

      // ================================================================
      //  初始视角
      //  有 ?country=XX 参数时飞向该国，否则北京 2000 公里
      // ================================================================
      var initLon = hasTarget ? urlLon : CENTER_LON;
      var initLat = hasTarget ? urlLat : CENTER_LAT;
      viewer.camera.setView({
        destination: Cesium.Cartesian3.fromDegrees(initLon, initLat, MIN_HEIGHT),
        orientation: { heading: 0, pitch: Cesium.Math.toRadians(-90), roll: 0 },
      });

      // ================================================================
      //  状态栏
      // ================================================================
      var statusLabel = urlCountry || '高度';
      var statusBar = document.getElementById('statusBar');
      scene.preRender.addEventListener(function () {
        var h = viewer.camera.positionCartographic.height;
        var km = (h / 1000).toFixed(0);
        statusBar.textContent = (urlCountry ? urlCountry + ' | ' : '') + '高度: ' + km + '公里 | Lv.6 | ' +
          (h <= MIN_HEIGHT + 100 ? '最近' : h >= MAX_HEIGHT - 100 ? '最远' : '');
      });

      // ================================================================
      //  启动加载流程
      //  先用 16 的模糊值快速出图（1-2秒），然后渐进清晰
      // ================================================================
      setTimeout(startReveal, 1500);

      // ================================================================
      //  快捷键
      // ================================================================
      document.addEventListener('keydown', function (e) {
        var key = e.key.toLowerCase();
        if (key === 'r') {
          viewer.camera.flyTo({
            destination: Cesium.Cartesian3.fromDegrees(CENTER_LON, CENTER_LAT, MIN_HEIGHT),
            orientation: { heading: 0, pitch: Cesium.Math.toRadians(-90), roll: 0 },
            duration: 2.5,
          });
        }
        if (key === 'f') {
          document.fullscreenElement ? document.exitFullscreen() : document.getElementById('cesiumContainer').requestFullscreen();
        }
      });

      // ================================================================
      //  纪录片数据：国家 → 经纬度 → 纪录片列表
      // ================================================================
      var countryDocs = [
        { name:'中国', flag:'🇨🇳', lon:116.4, lat:39.9, docs:[
          {title:'《美丽中国》',rating:'9.3',wonders:'青藏高原冰川、云南热带雨林、桂林喀斯特峰林、贵州溶洞、丹霞地貌、神农架原始森林',pf:['哔哩哔哩','腾讯视频']},
          {title:'《航拍中国》（全四季）',rating:'9.0~9.4',wonders:'张家界峰林、九寨沟彩池、塔克拉玛干沙漠、黄山云海、壶口瀑布、长白山天池、雅鲁藏布江峡谷',pf:['哔哩哔哩','腾讯视频']},
          {title:'《第三极》',rating:'9.4',wonders:'珠穆朗玛峰冰塔林、纳木错、羌塘无人区、藏北高原湿地、喜马拉雅山脉',pf:['哔哩哔哩','腾讯视频']}
        ]},
        { name:'日本', flag:'🇯🇵', lon:138, lat:37, docs:[
          {title:'《野性日本》',rating:'8.8',wonders:'富士山火山地貌、北海道流冰雪原、屋久岛原始森林、冲绳珊瑚礁、知床半岛海岸',pf:['哔哩哔哩']}
        ]},
        { name:'俄罗斯', flag:'🇷🇺', lon:90, lat:62, docs:[
          {title:'《野性俄罗斯》',rating:'8.9',wonders:'贝加尔湖、勘察加火山群、西伯利亚泰加林、北极苔原、高加索山脉',pf:['哔哩哔哩']}
        ]},
        { name:'印度', flag:'🇮🇳', lon:78, lat:22, docs:[
          {title:'《野性印度》',rating:'8.7',wonders:'喜马拉雅南麓山地、西高止山雨林、塔尔沙漠、恒河湿地、德干高原',pf:['哔哩哔哩']}
        ]},
        { name:'印度尼西亚', flag:'🇮🇩', lon:115, lat:-2, docs:[
          {title:'《野性印度尼西亚》',rating:'8.6',wonders:'科莫多岛、婆罗洲雨林、巴厘岛火山、苏拉威西珊瑚海、爪哇火山群',pf:['哔哩哔哩']}

      // ================================================================
      //  创建标记点（Billboard 发光点 + Label 国家名）
      // ================================================================
      var markerSize = 10; // 像素大小，2000km 高度可见

      countryDocs.forEach(function(c) {
        var entity = viewer.entities.add({
          position: Cesium.Cartesian3.fromDegrees(c.lon, c.lat),
          billboard: {
            image: createMarkerImage(),
            width: markerSize,
            height: markerSize,
            verticalOrigin: Cesium.VerticalOrigin.CENTER,
            horizontalOrigin: Cesium.HorizontalOrigin.CENTER,
          },
          label: {
            text: c.flag + ' ' + c.name,
            font: '12px "PingFang SC","Inter",sans-serif',
            fillColor: Cesium.Color.fromCssColorString('#ffffff'),
            outlineColor: Cesium.Color.fromCssColorString('#000000'),
            outlineWidth: 2,
            style: Cesium.LabelStyle.FILL_AND_OUTLINE,
            pixelOffset: new Cesium.Cartesian2(0, -16),
            verticalOrigin: Cesium.VerticalOrigin.TOP,
            horizontalOrigin: Cesium.HorizontalOrigin.CENTER,
            distanceDisplayCondition: new Cesium.DistanceDisplayCondition(0, 40000000),
          },
          _countryData: c,
        });
      });

      // Canvas 生成发光圆点纹理
      function createMarkerImage() {
        var size = 32;
        var canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        var ctx = canvas.getContext('2d');
        var half = size / 2;
        var grad = ctx.createRadialGradient(half, half, 0, half, half, half);
        grad.addColorStop(0, 'rgba(255,255,255,1)');
        grad.addColorStop(0.15, 'rgba(100,180,255,0.9)');
        grad.addColorStop(0.4, 'rgba(60,120,220,0.5)');
        grad.addColorStop(1, 'rgba(60,120,220,0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, size, size);
        return canvas;
      }

      // ================================================================
      //  点击标记 → 弹出纪录片卡片
      // ================================================================
      var popup = document.getElementById('docPopup');
      var popFlag = document.getElementById('popFlag');
      var popName = document.getElementById('popName');
      var popContent = document.getElementById('popContent');
      var markerHint = document.getElementById('markerHint');

      var handler = new Cesium.ScreenSpaceEventHandler(scene.canvas);
      handler.setInputAction(function (click) {
        var picked = viewer.scene.pick(click.position);
        if (picked && picked.id && picked.id._countryData) {
          var c = picked.id._countryData;

          // 飞向该国
          viewer.camera.flyTo({
            destination: Cesium.Cartesian3.fromDegrees(c.lon, c.lat, MIN_HEIGHT),
            orientation: { heading: 0, pitch: Cesium.Math.toRadians(-90), roll: 0 },
            duration: 1.5,
          });

          // 填充弹出卡片
          popFlag.textContent = c.flag;
          popName.textContent = c.name;
          var itemsHtml = '';
          c.docs.forEach(function(d) {
            itemsHtml += '<div class="doc-item">';
            itemsHtml += '<div class="doc-title-row"><span class="doc-title">' + d.title + '</span><span class="doc-rating">⭐ ' + d.rating + '</span></div>';
            itemsHtml += '<div class="doc-wonders">' + d.wonders + '</div>';
            d.pf.forEach(function(p) {
              itemsHtml += '<span class="platform-tag">' + p + '</span>';
            });
            itemsHtml += '</div>';
          });
          popContent.innerHTML = itemsHtml;
          popup.classList.add('visible');

          // 隐藏标记点提示
          markerHint.style.opacity = '0';
        } else {
          // 点击空白区域关闭
          popup.classList.remove('visible');
          markerHint.style.opacity = '1';
        }
      }, Cesium.ScreenSpaceEventType.LEFT_CLICK);

      // 遮罩加载完毕后显示提示
      setTimeout(function () {
        var check = setInterval(function () {
          if (overlay.classList.contains('hidden')) {
            markerHint.style.opacity = '1';
            clearInterval(check);
            // 如果从 nature-docs 跳转过来，自动弹出卡片
            if (hasTarget && urlCountry) {
              autoShowCountry(urlCountry);
            }
          }
        }, 500);
      }, 3000);

      function autoShowCountry(name) {
        var found = null;
        countryDocs.forEach(function(c) {
          if (c.name.indexOf(name) !== -1 || name.indexOf(c.name) !== -1) {
            found = c;
          }
        });
        // 精确匹配优先
        var exact = countryDocs.filter(function(c) { return c.name === name; });
        if (exact.length) found = exact[0];
        if (!found) return;

        // 飞向并弹出
        viewer.camera.flyTo({
          destination: Cesium.Cartesian3.fromDegrees(found.lon, found.lat, MIN_HEIGHT),
          orientation: { heading: 0, pitch: Cesium.Math.toRadians(-90), roll: 0 },
          duration: 1.5,
          complete: function () {
            popFlag.textContent = found.flag;
            popName.textContent = found.name;
            var itemsHtml = '';
            found.docs.forEach(function(d) {
              itemsHtml += '<div class="doc-item">';
              itemsHtml += '<div class="doc-title-row"><span class="doc-title">' + d.title + '</span><span class="doc-rating">⭐ ' + d.rating + '</span></div>';
              itemsHtml += '<div class="doc-wonders">' + d.wonders + '</div>';
              d.pf.forEach(function(p) { itemsHtml += '<span class="platform-tag">' + p + '</span>'; });
              itemsHtml += '</div>';
            });
            popContent.innerHTML = itemsHtml;
            popup.classList.add('visible');
            markerHint.style.opacity = '0';
          }
        });
      }

      console.log('Level6 | 北京 2000-3000km | 4096瓦片 | 纪录片标记点 | 点击弹出');
